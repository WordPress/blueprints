 array('posts_per_page' => -1, 'post_type' => $post_type ) );\nforeach ($posts as $post) wp_delete_post($post->ID, true);\n}","progress":{"caption":"Deleting all posts and pages"}},{"step":"runPHP","code":"<?php require_once '/wordpress/wp-load.php';\n$page_args = array(\n'post_type'    => 'post',\n'post_status'  => 'publish',\n'post_title'   => 'Clean Excerpt Truncation Demo',\n'post_content' => '<!-- wp:paragraph --> <p>This post demonstrates WP Multibyte Patch\\'s excerpt handling. The excerpt below contains Japanese text that will be truncated. With the plugin active, the text cuts cleanly at character boundaries instead of breaking mid-character (which would cause garbled text called \"mojibake\").</p> <!-- /wp:paragraph -->  <!-- wp:paragraph --> <p>日本語の文章がここから始まります。WordPress は通常、抜粋を作成する際にバイト数で文字列を切り取ります。これはASCII文字では問題ありませんが、日本語のようなマルチバイト文字では、文字の途中で切られてしまい、文字化けが発生します。WP Multibyte Patch はこの問題を解決し、文字の境界で正しく切り取るようにします。</p> <!-- /wp:paragraph -->  <!-- wp:paragraph --> <p>このプラグインがないと、抜粋の最後が「?」や意味不明な記号になることがあります。プラグインを有効にすると、きれいに「...」で終わります。</p> <!-- /wp:paragraph -->',\n'post_date'    => date( 'Y-m-d H:i:s', strtotime( '2025-01-02 12:00:00' ) ),\n);\n$page_id = wp_insert_post( $page_args, true );\nif ( is_wp_error( $page_id ) ) {\nerror_log( 'addPost error: ' . $page_id->get_error_message() );\n}","progress":{"caption":"addPost: Clean Excerpt Truncation Demo"}},{"step":"runPHP","code":"<?php require_once '/wordpress/wp-load.php';\n$page_args = array(\n'post_type'    => 'post',\n'post_status'  => 'publish',\n'post_title'   => '日本の四季について',\n'post_content' => '<!-- wp:paragraph --> <p>日本には美しい四季があります。春には桜が咲き、多くの人々が花見を楽しみます。夏は暑く、花火大会や夏祭りが各地で開催されます。秋になると紅葉が山々を彩り、観光客で賑わいます。冬は雪が降り、スキーやスノーボードを楽しむことができます。</p> <!-- /wp:paragraph -->  <!-- wp:paragraph --> <p>それぞれの季節には独特の食べ物や行事があり、日本文化の豊かさを感じることができます。春は新生活の始まりでもあり、入学式や入社式が行われます。夏休みには多くの家族が旅行に出かけ、海や山で過ごします。秋は食欲の秋とも呼ばれ、新米や秋刀魚など美味しい食材が豊富です。冬にはクリスマスや正月など、大きなイベントが続きます。</p> <!-- /wp:paragraph -->  <!-- wp:paragraph --> <p>日本を訪れる際は、季節に合わせた旅行計画を立てることをお勧めします。</p> <!-- /wp:paragraph -->',\n'post_date'    => date( 'Y-m-d H:i:s', strtotime( '2025-01-01 12:00:00' ) ),\n);\n$page_id = wp_insert_post( $page_args, true );\nif ( is_wp_error( $page_id ) ) {\nerror_log( 'addPost error: ' . $page_id->get_error_message() );\n}","progress":{"caption":"addPost: 日本の四季について"}}],"$schema":"https://playground.wordpress.net/blueprint-schema.json"}},"plugins-user-contributed/wpforms-lite.json":{"title":"WPForms – Easy Form Builder for WordPress","author":"https://wordpress.org/plugins/wpforms-lite/","screenshot_url":"plugins-user-contributed/wpforms-lite.jpg","blueprint":{"landingPage":"/wp-admin/admin.php?page=wpforms-builder","steps":[{"step":"installPlugin","pluginData":{"resource":"wordpress.org/plugins","slug":"wpforms-lite"},"options":{"activate":true}}],"$schema":"https://playground.wordpress.net/blueprint-schema.json"}}}</script>

<body>
    <div id="app"></div>

    <script type="module">
        const { h, render, useState, useEffect } = window;
        const dataElement = document.getElementById('blueprint-data');
        let embeddedIndex = null;
        if (dataElement) {
            try {
                embeddedIndex = JSON.parse(dataElement.textContent || '{}');
            } catch (error) {
                console.error('Failed to parse embedded blueprint data.', error);
            }
        }
        window.__EMBEDDED_BLUEPRINT_INDEX__ = embeddedIndex;

        function deriveBlueprintData(indexData) {
            if (!indexData || Object.keys(indexData).length === 0) {
                return null;
            }

            const entries = Object.entries(indexData).map(([path, meta], index) => {
                return {
                    path,
                    slug: path.replace(/\.json$/, '').replace(/^plugins-user-contributed\//, ''),
                    title: meta.title || 'Untitled Plugin',
                    author: meta.author || '',
                    screenshot_url: meta.screenshot_url || '',
                    blueprint: meta.blueprint || {},
                    order: index
                };
            });

            return {
                entries,
                stats: {
                    totalBlueprints: entries.length
                }
            };
        }

        const initialBlueprintData = deriveBlueprintData(embeddedIndex);

        function buildPreviewUrl(blueprint) {
            const json = JSON.stringify(blueprint);
            const base64 = btoa(unescape(encodeURIComponent(json)));
            return `https://playground.wordpress.net/?blueprint-url=data:application/json;base64,${base64}`;
        }

        function buildSourceUrl(path) {
            return `https://github.com/wordpress/blueprints/blob/trunk/${path}`;
        }

        function buildWpOrgUrl(slug) {
            return `https://wordpress.org/plugins/${slug}/`;
        }

        function formatNumber(value) {
            return value.toLocaleString('en-US');
        }

        function PluginCard({ blueprint }) {
            const previewUrl = buildPreviewUrl(blueprint.blueprint);
            const sourceUrl = buildSourceUrl(blueprint.path);
            const wpOrgUrl = buildWpOrgUrl(blueprint.slug);

            const metaChildren = [];

            const wpOrgLink = h('a', {
                href: wpOrgUrl,
                target: '_blank',
                rel: 'noreferrer noopener'
            }, 'WordPress.org');

            const sourceLink = h('a', {
                href: sourceUrl,
                target: '_blank',
                rel: 'noreferrer noopener'
            }, 'View source');

            metaChildren.push(wpOrgLink);
            metaChildren.push(' ');
            metaChildren.push(h('span', { className: 'meta-separator' }, '•'));
            metaChildren.push(' ');
            metaChildren.push(sourceLink);

            const metaLine = h('p', { className: 'pattern-card-meta' }, metaChildren);

            return h('article', { className: 'pattern-card' },
                blueprint.screenshot_url
                    ? h('img', {
                        className: 'pattern-card-image',
                        src: blueprint.screenshot_url,
                        alt: `${blueprint.title} screenshot`,
                        onError: (event) => {
                            event.target.style.display = 'none';
                            event.target.nextSibling.style.display = 'flex';
                        }
                    })
                    : null,
                h('div', {
                    className: 'pattern-card-image placeholder',
                    style: { display: blueprint.screenshot_url ? 'none' : 'flex' }
                }, 'No screenshot available'),
                h('div', { className: 'pattern-card-body' },
                    h('div', { className: 'pattern-card-header' },
                        h('h2', { className: 'pattern-card-title' }, blueprint.title),
                        h('a', {
                            href: previewUrl,
                            className: 'btn-try-it',
                            target: '_blank',
                            rel: 'noreferrer noopener'
                        },
                            h('img', {
                                src: 'playground-icon.png',
                                className: 'btn-icon',
                                alt: ''
                            }),
                            'Run'
                        )
                    ),
                    metaLine
                )
            );
        }

        function PlaceholderCard() {
            return h('article', { className: 'placeholder-card' },
                h('div', { className: 'placeholder-thumb skeleton-animate' }),
                h('div', { className: 'placeholder-body' },
                    h('div', { className: 'placeholder-line wide skeleton-animate' }),
                    h('div', { className: 'placeholder-line medium skeleton-animate' }),
                    h('div', { className: 'placeholder-line short skeleton-animate' })
                )
            );
        }

        function App() {
            const blueprintEntries = initialBlueprintData ? initialBlueprintData.entries : [];
            const blueprints = blueprintEntries;
            const stats = initialBlueprintData ? initialBlueprintData.stats : { totalBlueprints: 0 };

            const [filteredBlueprints, setFilteredBlueprints] = useState(blueprintEntries);
            const [searchTerm, setSearchTerm] = useState('');
            const isLoaded = Boolean(initialBlueprintData);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const searchParam = params.get('search');
                if (searchParam) {
                    setSearchTerm(searchParam);
                }
            }, []);

            useEffect(() => {
                if (!initialBlueprintData) {
                    console.error('Blueprint index data missing. Rebuild plugins.html to embed it.');
                }
            }, []);

            useEffect(() => {
                const params = new URLSearchParams();
                if (searchTerm) {
                    params.set('search', searchTerm);
                }
                const newUrl = params.toString()
                    ? `${window.location.pathname}?${params.toString()}`
                    : window.location.pathname;
                window.history.replaceState({}, '', newUrl);
            }, [searchTerm]);

            useEffect(() => {
                const term = searchTerm.trim().toLowerCase();

                const filtered = blueprints.filter(bp => {
                    const matchesSearch = !term ||
                        bp.title.toLowerCase().includes(term) ||
                        bp.slug.toLowerCase().includes(term);
                    return matchesSearch;
                });

                const sorted = [...filtered].sort((a, b) => a.title.localeCompare(b.title));
                setFilteredBlueprints(sorted);
            }, [searchTerm, blueprints]);

            const showingAll = filteredBlueprints.length === blueprints.length && !searchTerm;

            const resultsMessage = !isLoaded
                ? 'Loading plugin blueprints...'
                : showingAll
                    ? `Showing all ${formatNumber(blueprints.length)} plugin blueprints`
                    : `Showing ${formatNumber(filteredBlueprints.length)} of ${formatNumber(blueprints.length)} plugin blueprints`;

            const placeholderCards = Array.from({ length: 6 }).map((_, index) =>
                h(PlaceholderCard, { key: `placeholder-${index}` })
            );

            const shouldShowSkeletons = !isLoaded;
            const showEmptyState = isLoaded && filteredBlueprints.length === 0;

            const emptyState = h('div', { className: 'empty-state' },
                h('h2', null, 'No plugins match your search'),
                h('p', null, 'Try adjusting your search terms.')
            );

            const galleryContent = shouldShowSkeletons
                ? h('div', { className: 'gallery-grid skeleton-grid' }, placeholderCards)
                : showEmptyState
                    ? emptyState
                    : h('div', { className: 'gallery-grid' },
                        filteredBlueprints.map(bp =>
                            h(PluginCard, {
                                blueprint: bp,
                                key: bp.path
                            })
                        )
                    );

            return h('div', { className: 'page' },
                h('section', { className: 'hero' },
                    h('div', { className: 'hero-inner' },
                        h('div', { className: 'hero-header' },
                            h('img', {
                                src: 'playground-icon.png',
                                alt: 'WordPress Playground',
                                className: 'hero-logo'
                            }),
                            h('h1', { className: 'hero-title' }, 'Plugin Blueprints Gallery')
                        ),
                        h('p', { className: 'hero-subtitle' },
                            'Preview WordPress plugins instantly in ',
                            h('a', {
                                href: 'https://wordpress.github.io/wordpress-playground/',
                                target: '_blank',
                                rel: 'noreferrer noopener',
                                className: 'hero-link'
                            }, 'WordPress Playground'),
                            '. User-contributed blueprints for popular plugins. ',
                            h('a', {
                                href: 'gallery.html',
                                className: 'hero-link'
                            }, 'View all blueprints'),
                            '.'
                        )
                    )
                ),
                h('section', { className: 'filters-section' },
                    h('div', { className: 'filters-inner' },
                        h('div', { className: 'toolbar' },
                            h('div', { className: 'search-block' },
                                h('div', { className: 'search-field' },
                                    h('span', { className: 'search-icon' }, '⌕'),
                                    h('input', {
                                        type: 'search',
                                        placeholder: 'Search plugins',
                                        value: searchTerm,
                                        onInput: (event) => setSearchTerm(event.target.value)
                                    })
                                )
                            )
                        )
                    )
                ),
                h('main', { className: 'gallery-section' },
                    h('div', { className: 'gallery-inner' },
                        h('div', { className: 'results-summary' }, resultsMessage),
                        galleryContent
                    )
                ),
                h('footer', { className: 'footer' },
                    h('p', null,
                        'Want to contribute a plugin blueprint? Check out the ',
                        h('a', {
                            href: 'https://github.com/wordpress/blueprints/blob/trunk/README.md',
                            target: '_blank',
                            rel: 'noreferrer noopener'
                        }, 'contribution guidelines')
                    ),
                    h('p', { style: { marginTop: '1rem' } },
                        h('a', { href: 'https://github.com/wordpress/blueprints', target: '_blank' }, 'View on GitHub'),
                        ' • ',
                        h('a', { href: 'gallery.html' }, 'All Blueprints')
                    )
                )
            );
        }

        setTimeout(() => {
            if (window.h && window.render) {
                render(h(App), document.getElementById('app'));
            }
        }, 100);
    </script>
</body>
</html>
