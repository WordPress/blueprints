<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Blueprints Gallery</title>
    <script type="module">
        import { h, render, Component } from 'https://esm.sh/preact@10.19.3';
        import { useState, useEffect } from 'https://esm.sh/preact@10.19.3/hooks';
        window.h = h;
        window.Component = Component;
        window.useState = useState;
        window.useEffect = useEffect;
        window.render = render;
    </script>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-y: scroll;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #1f2937;
            background: #f3f4f6;
        }

        a {
            color: inherit;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f3f4f6;
        }

        .hero {
            background: #1f2937;
            color: #f9fafb;
            padding: 3rem 0 2.75rem;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.35);
        }

        .hero-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .hero-header {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .hero-logo {
            width: 48px;
            height: 48px;
        }

        .hero-title {
            font-size: 2.25rem;
            font-weight: 700;
            margin: 0;
        }

        .hero-subtitle {
            font-size: 1.05rem;
            color: #d1d5db;
            max-width: 820px;
            line-height: 1.7;
        }

        .hero-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }

        .hero-link:hover {
            text-decoration: underline;
        }

        .filters-section {
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .filters-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.75rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .toolbar {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-block {
            flex: 1;
            max-width: 500px;
        }

        .filter-chips {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-chip {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            font-size: 0.9rem;
            font-weight: 500;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-chip:hover {
            border-color: #9ca3af;
            background: #f9fafb;
        }

        .filter-chip.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }

        .filter-chip .chip-count {
            margin-left: 0.35rem;
            opacity: 0.7;
        }

        .search-field {
            position: relative;
        }

        .search-field input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.6rem;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background: #ffffff;
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-field input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .search-icon {
            position: absolute;
            top: 50%;
            left: 0.9rem;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1.35rem;
            pointer-events: none;
        }

        .gallery-section {
            flex: 1;
        }

        .gallery-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 2rem 3rem;
        }

        .results-summary {
            margin-bottom: 1.5rem;
            color: #6b7280;
            font-size: 0.95rem;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.75rem;
        }

        .skeleton-grid {
            opacity: 0.9;
        }

        .pattern-card {
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .pattern-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 45px rgba(15, 23, 42, 0.15);
        }

        .pattern-card-image {
            display: block;
            width: 100%;
            height: 230px;
            object-fit: cover;
            object-position: center top;
            background: #f3f4f6;
        }

        .pattern-card-image.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 230px;
            font-size: 0.95rem;
            color: #9ca3af;
        }

        .pattern-card-body {
            padding: 1.25rem 1.5rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            flex: 1;
        }

        .pattern-card-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            flex-wrap: nowrap;
        }

        .pattern-card-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: #111827;
            flex: 1 1 auto;
            min-width: 0;
        }

        .pattern-card-meta {
            margin: 0;
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: auto;
        }

        .pattern-card-meta a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .pattern-card-meta a:hover {
            text-decoration: underline;
        }

        .pattern-card-meta .meta-separator {
            color: #d1d5db;
            margin: 0 0.25rem;
            font-weight: 600;
        }

        .source-badge {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .source-badge.official {
            background: #dcfce7;
            color: #166534;
        }

        .source-badge.community {
            background: #e0e7ff;
            color: #4338ca;
        }

        .pattern-card-title a {
            color: inherit;
            text-decoration: none;
        }

        .pattern-card-title a:hover {
            text-decoration: underline;
        }

        .btn-try-it {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.25rem;
            background: #3858e9;
            color: #ffffff;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.1s ease;
            flex-shrink: 0;
        }

        .pattern-card-header .btn-try-it {
            margin-left: auto;
        }

        .btn-try-it:hover {
            background: #2a44d0;
            transform: translateY(-1px);
        }

        .btn-try-it .btn-icon {
            width: 18px;
            height: 18px;
        }

        .empty-state {
            margin-top: 3rem;
            text-align: center;
            padding: 3rem;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            color: #6b7280;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
        }

        .empty-state h2 {
            font-size: 1.6rem;
            color: #111827;
            margin-bottom: 0.75rem;
        }

        .placeholder-card {
            background: #ffffff;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            padding-bottom: 1.25rem;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .placeholder-thumb {
            height: 230px;
            background: #e5e7eb;
        }

        .placeholder-body {
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .placeholder-line {
            height: 12px;
            border-radius: 999px;
            background: #e5e7eb;
        }

        .placeholder-line.wide {
            width: 70%;
        }

        .placeholder-line.medium {
            width: 55%;
        }

        .placeholder-line.short {
            width: 40%;
        }

        .skeleton-animate {
            position: relative;
            overflow: hidden;
        }

        .skeleton-animate::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0) 100%);
            transform: translateX(-100%);
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }

        .footer {
            background: #f9fafb;
            padding: 3rem 2rem 3.5rem;
            color: #6b7280;
            font-size: 0.9rem;
            text-align: center;
            border-top: 1px solid #e5e7eb;
        }

        .footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 960px) {
            .hero-title {
                font-size: 2.4rem;
            }

            .toolbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-block {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .hero-inner {
                padding: 0 1.25rem;
            }

            .filters-inner {
                padding: 1.5rem 1.25rem;
            }

            .gallery-inner {
                padding: 1.5rem 1.25rem 2.5rem;
            }

            .pattern-card-body {
                padding: 1rem 1.1rem 1.1rem;
            }

            .pattern-card-header {
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        const { h, render, useState, useEffect } = window;

        async function fetchPluginData() {
            const [userContributed, wporgOfficial] = await Promise.all([
                fetch('plugins-data/user-contributed.json').then(r => r.json()),
                fetch('plugins-data/wporg-official.json').then(r => r.json())
            ]);

            const entries = [];

            for (const [path, meta] of Object.entries(userContributed)) {
                const slug = path.replace(/\.json$/, '').replace(/^plugins-user-contributed\//, '');
                entries.push({
                    path,
                    slug,
                    title: meta.title || slug,
                    author: meta.author || '',
                    screenshot_url: meta.screenshot_url || '',
                    active_installs: 0,
                    source: 'user-contributed'
                });
            }

            for (const [slug, meta] of Object.entries(wporgOfficial)) {
                const existingIndex = entries.findIndex(e => e.slug === slug);
                if (existingIndex >= 0) {
                    entries[existingIndex].active_installs = meta.active_installs || 0;
                    entries[existingIndex].hasOfficialBlueprint = true;
                } else {
                    entries.push({
                        path: null,
                        slug,
                        title: meta.name || slug,
                        author: '',
                        screenshot_url: meta.screenshot_url || '',
                        active_installs: meta.active_installs || 0,
                        source: 'wporg'
                    });
                }
            }

            return {
                entries,
                stats: {
                    totalBlueprints: entries.length,
                    userContributed: Object.keys(userContributed).length,
                    wporgOfficial: Object.keys(wporgOfficial).length
                }
            };
        }

        function buildPreviewUrl(blueprint) {
            if (blueprint.source === 'wporg') {
                const blueprintUrl = `https://wordpress.org/plugins/wp-json/plugins/v1/plugin/${blueprint.slug}/blueprint.json`;
                return `https://playground.wordpress.net/?blueprint-url=${encodeURIComponent(blueprintUrl)}`;
            }
            const rawUrl = `https://raw.githubusercontent.com/wordpress/blueprints/trunk/${blueprint.path}`;
            return `https://playground.wordpress.net/?blueprint-url=${encodeURIComponent(rawUrl)}`;
        }

        function buildSourceUrl(blueprint) {
            if (blueprint.source === 'wporg') {
                return `https://wordpress.org/plugins/wp-json/plugins/v1/plugin/${blueprint.slug}/blueprint.json`;
            }
            return `https://github.com/wordpress/blueprints/blob/trunk/${blueprint.path}`;
        }

        function buildWpOrgUrl(slug) {
            return `https://wordpress.org/plugins/${slug}/`;
        }

        function decodeHtmlEntities(text) {
            if (!text) return '';
            return text
                .replace(/&#8211;/g, '\u2013')
                .replace(/&#8212;/g, '\u2014')
                .replace(/&#8217;/g, '\u2019')
                .replace(/&#8216;/g, '\u2018')
                .replace(/&#8220;/g, '\u201c')
                .replace(/&#8221;/g, '\u201d')
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&quot;/g, '"')
                .replace(/&#039;/g, "'");
        }

        function formatNumber(value) {
            return value.toLocaleString('en-US');
        }

        function PluginCard({ blueprint }) {
            const previewUrl = buildPreviewUrl(blueprint);
            const sourceUrl = buildSourceUrl(blueprint);
            const wpOrgUrl = buildWpOrgUrl(blueprint.slug);
            const title = decodeHtmlEntities(blueprint.title);

            const metaChildren = [];

            if (blueprint.source === 'wporg') {
                metaChildren.push(h('span', { className: 'source-badge official' }, 'By Author'));
            } else {
                metaChildren.push(h('span', { className: 'source-badge community' }, 'By Community'));
            }
            metaChildren.push(' ');
            metaChildren.push(h('span', { className: 'meta-separator' }, '\u00b7'));
            metaChildren.push(' ');
            metaChildren.push(h('a', {
                href: sourceUrl,
                target: '_blank',
                rel: 'noreferrer noopener'
            }, 'View Blueprint'));

            const metaLine = h('p', { className: 'pattern-card-meta' }, metaChildren);

            return h('article', { className: 'pattern-card' },
                blueprint.screenshot_url
                    ? h('img', {
                        className: 'pattern-card-image',
                        src: blueprint.screenshot_url,
                        alt: title,
                        onError: (event) => {
                            event.target.style.display = 'none';
                            event.target.nextSibling.style.display = 'flex';
                        }
                    })
                    : null,
                h('div', {
                    className: 'pattern-card-image placeholder',
                    style: { display: blueprint.screenshot_url ? 'none' : 'flex' }
                }, 'No screenshot'),
                h('div', { className: 'pattern-card-body' },
                    h('div', { className: 'pattern-card-header' },
                        h('h2', { className: 'pattern-card-title' },
                            h('a', {
                                href: wpOrgUrl,
                                target: '_blank',
                                rel: 'noreferrer noopener'
                            }, title)
                        ),
                        h('a', {
                            href: previewUrl,
                            className: 'btn-try-it',
                            target: '_blank',
                            rel: 'noreferrer noopener'
                        },
                            h('img', {
                                src: 'playground-icon.png',
                                className: 'btn-icon',
                                alt: ''
                            }),
                            'Run'
                        )
                    ),
                    metaLine
                )
            );
        }

        function PlaceholderCard() {
            return h('article', { className: 'placeholder-card' },
                h('div', { className: 'placeholder-thumb skeleton-animate' }),
                h('div', { className: 'placeholder-body' },
                    h('div', { className: 'placeholder-line wide skeleton-animate' }),
                    h('div', { className: 'placeholder-line medium skeleton-animate' }),
                    h('div', { className: 'placeholder-line short skeleton-animate' })
                )
            );
        }

        function App() {
            const [blueprintData, setBlueprintData] = useState(null);
            const [filteredBlueprints, setFilteredBlueprints] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [sourceFilter, setSourceFilter] = useState('all');

            const isLoaded = Boolean(blueprintData);
            const blueprints = blueprintData ? blueprintData.entries : [];
            const stats = blueprintData ? blueprintData.stats : { totalBlueprints: 0, userContributed: 0, wporgOfficial: 0 };

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const searchParam = params.get('search');
                const filterParam = params.get('filter');
                if (searchParam) setSearchTerm(searchParam);
                if (filterParam && ['all', 'user-contributed', 'wporg'].includes(filterParam)) {
                    setSourceFilter(filterParam);
                }
            }, []);

            useEffect(() => {
                fetchPluginData()
                    .then(data => setBlueprintData(data))
                    .catch(err => console.error('Failed to load plugin data:', err));
            }, []);

            useEffect(() => {
                const params = new URLSearchParams();
                if (searchTerm) params.set('search', searchTerm);
                if (sourceFilter !== 'all') params.set('filter', sourceFilter);
                const newUrl = params.toString()
                    ? `${window.location.pathname}?${params.toString()}`
                    : window.location.pathname;
                window.history.replaceState({}, '', newUrl);
            }, [searchTerm, sourceFilter]);

            useEffect(() => {
                const term = searchTerm.trim().toLowerCase();

                const filtered = blueprints.filter(bp => {
                    const matchesSearch = !term ||
                        bp.title.toLowerCase().includes(term) ||
                        bp.slug.toLowerCase().includes(term);
                    const matchesSource = sourceFilter === 'all' || bp.source === sourceFilter;
                    return matchesSearch && matchesSource;
                });

                const sorted = [...filtered].sort((a, b) => {
                    if (b.active_installs !== a.active_installs) {
                        return b.active_installs - a.active_installs;
                    }
                    return a.title.localeCompare(b.title);
                });
                setFilteredBlueprints(sorted);
            }, [searchTerm, sourceFilter, blueprints]);

            const filterLabel = sourceFilter === 'all' ? '' :
                sourceFilter === 'user-contributed' ? 'user-contributed ' : 'official ';

            const resultsMessage = !isLoaded
                ? 'Loading plugin blueprints...'
                : `Showing ${formatNumber(filteredBlueprints.length)} ${filterLabel}plugin blueprints`;

            const placeholderCards = Array.from({ length: 6 }).map((_, index) =>
                h(PlaceholderCard, { key: `placeholder-${index}` })
            );

            const shouldShowSkeletons = !isLoaded;
            const showEmptyState = isLoaded && filteredBlueprints.length === 0;

            const emptyState = h('div', { className: 'empty-state' },
                h('h2', null, 'No plugins match your search'),
                h('p', null, 'Try adjusting your search terms.')
            );

            const galleryContent = shouldShowSkeletons
                ? h('div', { className: 'gallery-grid skeleton-grid' }, placeholderCards)
                : showEmptyState
                    ? emptyState
                    : h('div', { className: 'gallery-grid' },
                        filteredBlueprints.map(bp =>
                            h(PluginCard, {
                                blueprint: bp,
                                key: bp.path || bp.slug
                            })
                        )
                    );

            return h('div', { className: 'page' },
                h('section', { className: 'hero' },
                    h('div', { className: 'hero-inner' },
                        h('div', { className: 'hero-header' },
                            h('img', {
                                src: 'playground-icon.png',
                                alt: 'WordPress Playground',
                                className: 'hero-logo'
                            }),
                            h('h1', { className: 'hero-title' }, 'Plugin Blueprints Gallery')
                        ),
                        h('p', { className: 'hero-subtitle' },
                            'Preview WordPress plugins instantly in ',
                            h('a', {
                                href: 'https://wordpress.github.io/wordpress-playground/',
                                target: '_blank',
                                rel: 'noreferrer noopener',
                                className: 'hero-link'
                            }, 'WordPress Playground'),
                            '. Browse official plugin previews from WordPress.org and user-contributed blueprints. ',
                            h('a', {
                                href: 'gallery.html',
                                className: 'hero-link'
                            }, 'View all blueprints'),
                            '.'
                        )
                    )
                ),
                h('section', { className: 'filters-section' },
                    h('div', { className: 'filters-inner' },
                        h('div', { className: 'toolbar' },
                            h('div', { className: 'search-block' },
                                h('div', { className: 'search-field' },
                                    h('span', { className: 'search-icon' }, '⌕'),
                                    h('input', {
                                        type: 'search',
                                        placeholder: 'Search plugins',
                                        value: searchTerm,
                                        onInput: (event) => setSearchTerm(event.target.value)
                                    })
                                )
                            ),
                            h('div', { className: 'filter-chips' },
                                h('button', {
                                    className: 'filter-chip' + (sourceFilter === 'all' ? ' active' : ''),
                                    onClick: () => setSourceFilter('all')
                                }, 'All', h('span', { className: 'chip-count' }, isLoaded ? formatNumber(stats.totalBlueprints) : '...')),
                                h('button', {
                                    className: 'filter-chip' + (sourceFilter === 'wporg' ? ' active' : ''),
                                    onClick: () => setSourceFilter('wporg')
                                }, 'By Author', h('span', { className: 'chip-count' }, isLoaded ? formatNumber(stats.wporgOfficial) : '...')),
                                h('button', {
                                    className: 'filter-chip' + (sourceFilter === 'user-contributed' ? ' active' : ''),
                                    onClick: () => setSourceFilter('user-contributed')
                                }, 'By Community', h('span', { className: 'chip-count' }, isLoaded ? formatNumber(stats.userContributed) : '...'))
                            )
                        )
                    )
                ),
                h('main', { className: 'gallery-section' },
                    h('div', { className: 'gallery-inner' },
                        h('div', { className: 'results-summary' }, resultsMessage),
                        galleryContent
                    )
                ),
                h('footer', { className: 'footer' },
                    h('p', null,
                        'Want to contribute a plugin blueprint? Check out the ',
                        h('a', {
                            href: 'https://github.com/wordpress/blueprints/blob/trunk/README.md',
                            target: '_blank',
                            rel: 'noreferrer noopener'
                        }, 'contribution guidelines')
                    ),
                    h('p', { style: { marginTop: '1rem' } },
                        h('a', { href: 'https://github.com/wordpress/blueprints', target: '_blank' }, 'View on GitHub'),
                        ' • ',
                        h('a', { href: 'gallery.html' }, 'All Blueprints')
                    )
                )
            );
        }

        setTimeout(() => {
            if (window.h && window.render) {
                render(h(App), document.getElementById('app'));
            }
        }, 100);
    </script>
</body>
</html>
